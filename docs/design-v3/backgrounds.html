<title>ArGadaagdo Backgrounds</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Georgian:wght@400;700&family=Noto+Sans+Georgian:wght@400;500;700&display=swap">
<style>
/* Layout: three phone frames side by side (stack on phones), each running one live background idea under the same home-screen content. */
:root{
  --page:#ECE6D6; --ink:#0B2B26; --muted:#4E6B63;
  --green:#0F3A32; --green2:#164A3F; --mint:#B8E6C4; --cream:#F7F1E3;
  --honey:#F4C15D; --sage:#8FD19E; --sky:#A9C8F2; --coral:#F2997A;
  --serif:'Noto Serif Georgian',Georgia,serif; --sans:'Noto Sans Georgian',system-ui,sans-serif;
}
body{background:var(--page);color:var(--ink);font-family:var(--sans);margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-block:36px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-family:var(--serif);font-weight:700;font-size:30px;margin:0 0 6px;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 28px;max-width:60ch;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}
@media (max-width:900px){.grid{grid-template-columns:1fr;justify-items:center}}
figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:14px;min-width:0}
.phone{position:relative;width:300px;max-width:100%;aspect-ratio:300/620;border-radius:44px;overflow:hidden;box-shadow:0 0 0 10px #111,0 30px 60px rgba(11,43,38,.25)}
.bg{position:absolute;inset:0}
.ui{position:relative;z-index:2;padding:46px 18px 0;display:flex;flex-direction:column;gap:14px;height:100%;box-sizing:border-box}
.top{display:flex;justify-content:space-between;align-items:center}
.brand{font-family:var(--serif);font-weight:700;font-size:17px}
.icons{display:flex;gap:8px}
.ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700}
.hello{font-family:var(--serif);font-size:24px;line-height:1.2;margin:6px 0 0}
.chips{display:flex;gap:6px}
.chip{padding:6px 11px;border-radius:999px;font-size:11px;font-weight:700}
.card{border-radius:24px;padding:12px;display:flex;gap:12px;align-items:center}
.ph{width:58px;height:58px;border-radius:14px 30px 14px 14px;flex:none}
.card b{display:block;font-size:14px}
.card span{font-size:12px}
.nav{position:absolute;left:14px;right:14px;bottom:16px;height:54px;border-radius:22px;display:flex;justify-content:space-around;align-items:center;z-index:3}
.dot{width:22px;height:22px;border-radius:7px;opacity:.85}
.dot.on{width:64px;border-radius:14px}
figcaption{text-align:center;max-width:300px}
figcaption b{font-family:var(--serif);font-size:18px;display:block;margin-bottom:4px}
figcaption span{color:var(--muted);font-size:14px;line-height:1.5}

/* A — Leaf Drift: deep green, big soft leaves floating */
.a .bg{background:radial-gradient(120% 80% at 80% 0%,#1C5A4B 0%,var(--green) 55%,#0A2A24 100%)}
.leaf{position:absolute;width:220px;height:220px;opacity:.16;animation:drift 18s ease-in-out infinite}
.leaf svg{width:100%;height:100%}
.l1{left:-60px;top:60px}.l2{right:-80px;top:260px;width:280px;height:280px;animation-duration:24s;animation-delay:-6s;opacity:.12}
.l3{left:40px;bottom:-90px;width:180px;height:180px;animation-duration:20s;animation-delay:-11s}
@keyframes drift{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(18px,-26px) rotate(14deg)}}
.a .ui{color:var(--cream)}.a .ic{background:rgba(247,241,227,.12);color:var(--mint)}
.a .chip{background:rgba(247,241,227,.1);color:var(--cream)}.a .chip.on{background:var(--mint);color:var(--green)}
.a .card{background:rgba(247,241,227,.1);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(184,230,196,.18)}
.a .card span{color:#C3DDCB}.a .ph{background:var(--honey)}
.a .nav{background:rgba(10,42,36,.75);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}.a .dot{background:var(--mint)}

/* B — Market Morning: cream ground, slow colour clouds in the four category colours */
.b .bg{background:var(--cream);overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(38px);opacity:.75;animation:float 16s ease-in-out infinite}
.bh{width:240px;height:240px;background:var(--honey);left:-70px;top:-40px}
.bs{width:220px;height:220px;background:var(--sage);right:-80px;top:180px;animation-delay:-4s;animation-duration:19s}
.bk{width:200px;height:200px;background:var(--sky);left:-50px;top:380px;animation-delay:-9s;animation-duration:22s}
.bc{width:180px;height:180px;background:var(--coral);right:-30px;bottom:-60px;animation-delay:-13s;animation-duration:17s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(40px,30px) scale(1.12)}66%{transform:translate(-20px,50px) scale(.92)}}
.b .ui{color:var(--ink)}.b .ic{background:rgba(255,255,255,.6);color:var(--green)}
.b .chip{background:rgba(255,255,255,.55);color:var(--ink)}.b .chip.on{background:var(--green);color:var(--cream)}
.b .card{background:rgba(255,255,255,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.7)}
.b .card span{color:var(--muted)}.b .ph{background:var(--coral)}
.b .nav{background:var(--green)}.b .dot{background:var(--mint)}

/* C — Contour Flow: deep green with moving fine mint lines (canvas) */
.c .bg{background:linear-gradient(180deg,#0E3530,#0A2622)}
.c canvas{position:absolute;inset:0;width:100%;height:100%}
.c .ui{color:var(--cream)}.c .ic{background:rgba(184,230,196,.12);color:var(--mint)}
.c .chip{background:rgba(184,230,196,.1);color:var(--cream);border:1px solid rgba(184,230,196,.2)}.c .chip.on{background:var(--mint);color:var(--green)}
.c .card{background:rgba(10,38,34,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(184,230,196,.22)}
.c .card span{color:#9FC9B0}.c .ph{background:var(--sage)}
.c .nav{background:rgba(5,22,19,.8)}.c .dot{background:var(--mint)}

/* D — A+B mix: Market Morning clouds + small detailed leaves drifting */
.d .bg{background:radial-gradient(120% 80% at 80% 0%,#1C5A4B 0%,var(--green) 55%,#0A2622 100%);overflow:hidden}
.d canvas{position:absolute;inset:0;width:100%;height:100%}
.d .mini{position:absolute;width:46px;height:46px;opacity:.5;animation:sway 14s ease-in-out infinite}
.d .mini svg{width:100%;height:100%}
.m1{left:22px;top:150px}.m2{right:26px;top:96px;width:38px;height:38px;animation-delay:-3s;animation-duration:17s}
.m3{left:120px;top:330px;width:34px;height:34px;animation-delay:-7s}.m4{right:40px;top:440px;width:50px;height:50px;animation-delay:-10s;animation-duration:19s}
.m5{left:30px;top:520px;width:30px;height:30px;animation-delay:-5s;animation-duration:15s}.m6{right:110px;top:250px;width:28px;height:28px;animation-delay:-12s}
@keyframes sway{0%,100%{transform:translate(0,0) rotate(-8deg)}50%{transform:translate(10px,-18px) rotate(12deg)}}
.d .ui{color:var(--cream)}.d .ic{background:rgba(247,241,227,.12);color:var(--mint)}
.d .chip{background:rgba(247,241,227,.1);color:var(--cream);border:1px solid rgba(184,230,196,.2)}.d .chip.on{background:var(--mint);color:var(--green)}
.d .card{background:rgba(10,38,34,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(184,230,196,.22)}
.d .card span{color:#C3DDCB}.d .ph{background:var(--sage)}
.d .nav{background:rgba(5,22,19,.8);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}.d .dot{background:var(--mint)}
.mix{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:20px;padding-top:28px;border-top:1px solid rgba(11,43,38,.15)}

@media (prefers-reduced-motion:reduce){.leaf,.blob,.mini{animation:none}}
</style>

          <div class="card"><div class="ph" style="background:var(--honey)"></div><div><b>ქალაქის საცხობი</b><span>7 ₾ · 19:00–21:00 · 0.8 კმ</span></div></div>
          <div class="card"><div class="ph"></div><div><b>ვაკის კაფე</b><span>10 ₾ · 20:00–21:30 · 1.4 კმ</span></div></div>

<script>
(function(){
  document.querySelectorAll('#lines, canvas.flow').forEach(function(cv){
  const ctx=cv.getContext('2d'); let w,h,t=0;
  const still=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size(){const r=cv.getBoundingClientRect();const d=window.devicePixelRatio||1;w=r.width;h=r.height;cv.width=w*d;cv.height=h*d;ctx.setTransform(d,0,0,d,0,0)}
  function draw(){
    ctx.clearRect(0,0,w,h);
    for(let i=0;i<26;i++){
      const base=h*0.08+i*(h/24);
      ctx.beginPath();
      for(let x=0;x<=w;x+=6){
        const y=base+Math.sin(x*0.018+t*0.6+i*0.35)*14+Math.sin(x*0.007-t*0.4+i*0.2)*22;
        x?ctx.lineTo(x,y):ctx.moveTo(x,y);
      }
      const a=0.08+0.18*Math.max(0,Math.sin(i*0.4+t*0.3));
      ctx.strokeStyle='rgba(184,230,196,'+a.toFixed(3)+')';
      ctx.lineWidth=1;ctx.stroke();
    }
    t+=0.012;
    if(!still) requestAnimationFrame(draw);
  }
  size(); draw(); window.addEventListener('resize',size);
});
})();
</script>
