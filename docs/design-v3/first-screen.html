<title>ArGadaagdo First Open</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Georgian:wght@400;700&family=Noto+Sans+Georgian:wght@300;400;500;700&display=swap">
<style>
/* Layout: one launch animation (rings + drawn leaf) that flows into the welcome screen; two welcome variants. */
:root{
  --page:#E9E4D6; --ink:#0B2B26; --muted:#4E6B63;
  --green:#0F3A32; --green2:#164A3F; --mint:#B8E6C4; --cream:#F7F1E3; --honey:#F4C15D;
  --serif:'Noto Serif Georgian',Georgia,serif; --sans:'Noto Sans Georgian',system-ui,sans-serif;
}
body{background:var(--page);color:var(--ink);font-family:var(--sans);margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-block:32px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:44px}
h1{font-family:var(--serif);font-size:30px;margin:0 0 6px;text-wrap:balance}
h2{font-family:var(--serif);font-size:21px;margin:0 0 4px}
.lead{color:var(--muted);margin:0;max-width:62ch;line-height:1.6}
.row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px;margin-top:18px}
@media (max-width:900px){.row{grid-template-columns:1fr;justify-items:center}}
figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0}
figcaption{text-align:center;max-width:300px}
figcaption b{font-family:var(--serif);font-size:17px;display:block;margin-bottom:4px}
figcaption span{color:var(--muted);font-size:14px;line-height:1.5}
.phone{position:relative;width:280px;max-width:100%;aspect-ratio:280/580;border-radius:42px;overflow:hidden;box-shadow:0 0 0 9px #111,0 26px 50px rgba(11,43,38,.22)}
.replay{font:inherit;font-size:13px;font-weight:700;padding:8px 14px;border-radius:10px;border:1px solid var(--green);background:transparent;color:var(--green);cursor:pointer}
.replay:focus-visible{outline:2px solid var(--green);outline-offset:2px}

/* ---------- shared mark: rings + line-drawn leaf ---------- */
.mark .ln{fill:none;stroke:var(--mint);stroke-width:1;opacity:0;transform-origin:100px 100px}
.mark .l1{animation:ripple 1.4s .05s ease-out forwards}.mark .l2{animation:ripple 1.4s .2s ease-out forwards}
.mark .l3{animation:ripple 1.4s .35s ease-out forwards}.mark .l4{animation:ripple 1.4s .5s ease-out forwards}
.mark .outline{fill:none;stroke:var(--mint);stroke-width:1.6;stroke-dasharray:420;stroke-dashoffset:420;animation:draw 1s .55s cubic-bezier(.6,0,.3,1) forwards}
.mark .rib{fill:none;stroke:var(--mint);stroke-width:1.3;stroke-dasharray:130;stroke-dashoffset:130;animation:draw .55s 1.25s ease-out forwards}
.mark .v{fill:none;stroke:var(--mint);stroke-width:.9;stroke-dasharray:30;stroke-dashoffset:30;stroke-linecap:round}
.mark .v1{animation:draw .3s 1.5s ease-out forwards}.mark .v2{animation:draw .3s 1.56s ease-out forwards}.mark .v3{animation:draw .3s 1.62s ease-out forwards}
.mark .v4{animation:draw .3s 1.68s ease-out forwards}.mark .v5{animation:draw .3s 1.74s ease-out forwards}.mark .v6{animation:draw .3s 1.8s ease-out forwards}
.mark .fill{fill:var(--mint);opacity:0;animation:fillin .6s 1.9s ease-out forwards}
.mark .glow{fill:var(--mint);opacity:0;filter:blur(18px);animation:glow 1.2s 1.9s ease-out forwards}
@keyframes ripple{0%{opacity:0;transform:scale(.35)}40%{opacity:.55}100%{opacity:.2;transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fillin{to{opacity:.16}}
@keyframes glow{0%{opacity:0}50%{opacity:.35}100%{opacity:.12}}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- 1 · launch ---------- */
.launch{background:radial-gradient(90% 70% at 50% 42%,#1C5A4B,var(--green) 70%)}
.launch .stage{position:absolute;inset:0;display:grid;place-items:center}
.launch svg{width:210px;height:210px;margin-top:-30px}
.launch .tag{position:absolute;left:0;right:0;bottom:96px;text-align:center;font-size:12px;font-weight:300;letter-spacing:.06em;color:var(--mint);opacity:0;animation:fade .6s 2.3s ease-out forwards}
.launch .name{position:absolute;left:0;right:0;bottom:124px;text-align:center;font-family:var(--serif);font-size:22px;letter-spacing:.05em;color:var(--cream);opacity:0;animation:fade .6s 2.05s ease-out forwards}

/* ---------- welcome W1 · full green, mark stays on top ---------- */
.w1{background:radial-gradient(90% 60% at 50% 28%,#1C5A4B,var(--green) 72%)}
.w1 .ui,.w2 .ui{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:70px 26px 30px;box-sizing:border-box;text-align:center}
.w1 svg{width:160px;height:160px}
.w1 .title{font-family:var(--serif);font-size:30px;color:var(--cream);margin:10px 0 8px;opacity:0;animation:fade .6s 2.1s ease-out forwards}
.w1 .line{font-size:14px;font-weight:300;color:var(--mint);line-height:1.6;max-width:22ch;opacity:0;animation:fade .6s 2.3s ease-out forwards}
.w1 .grow{flex:1}
.w1 .btns{width:100%;display:flex;flex-direction:column;gap:6px;opacity:0;animation:fade .6s 2.5s ease-out forwards}
.btn{display:block;text-align:center;padding:14px;border-radius:14px;font-weight:700;font-size:15px;text-decoration:none}
.btn.mint{background:var(--mint);color:var(--green)}
.btn.ghost{color:var(--cream);font-weight:400;font-size:13px;padding:10px}
.lang{position:absolute;top:44px;right:20px;font-size:11px;font-weight:700;color:var(--mint);border:1px solid rgba(184,230,196,.35);padding:4px 9px;border-radius:999px}

/* ---------- welcome W2 · green top, cream bottom ---------- */
.w2{background:var(--cream)}
.w2 .top{position:absolute;left:0;right:0;top:0;height:60%;background:radial-gradient(90% 70% at 50% 40%,#1C5A4B,var(--green) 72%)}
.w2 .wave{position:absolute;left:0;right:0;top:calc(60% - 1px)}
.w2 svg.m{width:150px;height:150px}
.w2 .title{font-family:var(--serif);font-size:28px;color:var(--cream);margin:6px 0 0;opacity:0;animation:fade .6s 2.1s ease-out forwards}
.w2 .grow{flex:1}
.w2 .line{font-size:14px;color:var(--muted);line-height:1.6;max-width:24ch;margin:0 0 18px;opacity:0;animation:fade .6s 2.3s ease-out forwards}
.w2 .btns{width:100%;display:flex;flex-direction:column;gap:6px;opacity:0;animation:fade .6s 2.5s ease-out forwards}
.btn.green{background:var(--green);color:var(--cream)}
.btn.ghost.dark{color:var(--green)}

@media (prefers-reduced-motion:reduce){*{animation:none!important}.mark .outline,.mark .rib,.mark .v{stroke-dashoffset:0}.mark .fill{opacity:.16}.mark .ln{opacity:.2}.name,.title,.line,.btns{opacity:1!important}}
</style>

<div class="wrap">
  <header>
    <h1>The first 5 seconds</h1>
    <p class="lead">Rings spread out (from C), then one fine line draws the detailed leaf (from A). On the welcome screen the same mark stays at the top, so the launch flows straight into it. Tap "Play again" under each phone.</p>
  </header>

  <section>
    <div class="row">
      <figure>
        <div class="phone launch" data-anim>
          <div class="stage">
            <svg class="mark" viewBox="0 0 200 200" aria-hidden="true">
              <circle class="ln l1" cx="100" cy="100" r="40"/><circle class="ln l2" cx="100" cy="100" r="58"/>
              <circle class="ln l3" cx="100" cy="100" r="76"/><circle class="ln l4" cx="100" cy="100" r="94"/>
              <ellipse class="glow" cx="100" cy="100" rx="40" ry="40"/>
              <path class="fill" d="M66 140 C60 100 84 70 136 60 C142 108 112 138 70 142 Z"/>
              <path class="outline" d="M66 140 C60 100 84 70 136 60 C142 108 112 138 70 142 Z"/>
              <path class="rib" d="M69 141 C90 118 112 92 134 63"/>
              <path class="v v1" d="M82 126 L77 108"/><path class="v v2" d="M94 112 L90 92"/><path class="v v3" d="M107 97 L105 78"/>
              <path class="v v4" d="M85 124 L102 125"/><path class="v v5" d="M97 110 L116 108"/><path class="v v6" d="M110 95 L127 91"/>
            </svg>
          </div>
          <div class="name">არ გადააგდო</div>
          <div class="tag">საკვებს მეორე შანსი ეკუთვნის</div>
        </div>
        <button class="replay" type="button">Play again</button>
        <figcaption><b>Launch · Rings + Line Leaf</b><span>2 seconds: rings ripple out, a single line draws the leaf with its midrib and six veins, a soft glow, then the name and the line “Food deserves a second chance”.</span></figcaption>
      </figure>

      <figure>
        <div class="phone w1" data-anim>
          <span class="lang">KA</span>
          <div class="ui">
            <svg class="mark" viewBox="0 0 200 200" aria-hidden="true">
              <circle class="ln l1" cx="100" cy="100" r="40"/><circle class="ln l2" cx="100" cy="100" r="58"/>
              <circle class="ln l3" cx="100" cy="100" r="76"/><circle class="ln l4" cx="100" cy="100" r="94"/>
              <ellipse class="glow" cx="100" cy="100" rx="40" ry="40"/>
              <path class="fill" d="M66 140 C60 100 84 70 136 60 C142 108 112 138 70 142 Z"/>
              <path class="outline" d="M66 140 C60 100 84 70 136 60 C142 108 112 138 70 142 Z"/>
              <path class="rib" d="M69 141 C90 118 112 92 134 63"/>
              <path class="v v1" d="M82 126 L77 108"/><path class="v v2" d="M94 112 L90 92"/><path class="v v3" d="M107 97 L105 78"/>
              <path class="v v4" d="M85 124 L102 125"/><path class="v v5" d="M97 110 L116 108"/><path class="v v6" d="M110 95 L127 91"/>
            </svg>
            <div class="title">არ გადააგდო</div>
            <div class="line">საკვებს მეორე შანსი ეკუთვნის</div>
            <div class="grow"></div>
            <div class="btns">
              <a class="btn mint" href="#start">დაწყება</a>
              <a class="btn ghost" href="#start">შესვლა</a>
            </div>
          </div>
        </div>
        <button class="replay" type="button">Play again</button>
        <figcaption><b>Welcome · Quiet green</b><span>Only the mark, the name, one short line and two buttons. Nothing else.</span></figcaption>
      </figure>

      <figure>
        <div class="phone w2" data-anim>
          <div class="top"></div>
          <svg class="wave" viewBox="0 0 280 40" preserveAspectRatio="none" width="100%" height="40" aria-hidden="true"><path d="M0 0 H280 V14 C210 40 140 0 70 20 C40 28 18 26 0 18 Z" fill="#0F3A32"/></svg>
          <span class="lang">KA</span>
          <div class="ui">
            <svg class="mark m" viewBox="0 0 200 200" aria-hidden="true">
              <circle class="ln l1" cx="100" cy="100" r="40"/><circle class="ln l2" cx="100" cy="100" r="58"/>
              <circle class="ln l3" cx="100" cy="100" r="76"/><circle class="ln l4" cx="100" cy="100" r="94"/>
              <ellipse class="glow" cx="100" cy="100" rx="40" ry="40"/>
              <path class="fill" d="M66 140 C60 100 84 70 136 60 C142 108 112 138 70 142 Z"/>
              <path class="outline" d="M66 140 C60 100 84 70 136 60 C142 108 112 138 70 142 Z"/>
              <path class="rib" d="M69 141 C90 118 112 92 134 63"/>
              <path class="v v1" d="M82 126 L77 108"/><path class="v v2" d="M94 112 L90 92"/><path class="v v3" d="M107 97 L105 78"/>
              <path class="v v4" d="M85 124 L102 125"/><path class="v v5" d="M97 110 L116 108"/><path class="v v6" d="M110 95 L127 91"/>
            </svg>
            <div class="title">არ გადააგდო</div>
            <div class="grow"></div>
            <p class="line">ერთად ვზრუნავთ, რომ არაფერი დაიკარგოს.</p>
            <div class="btns">
              <a class="btn green" href="#start">დაწყება</a>
              <a class="btn ghost dark" href="#start">შესვლა</a>
            </div>
          </div>
        </div>
        <button class="replay" type="button">Play again</button>
        <figcaption><b>Welcome · Green and beige</b><span>The mark on green, a soft wave into beige, one warm line and two buttons. Matches the app's green-and-beige balance.</span></figcaption>
      </figure>
    </div>
  </section>
</div>

<script>
document.querySelectorAll('.replay').forEach(function(btn){
  btn.addEventListener('click',function(){
    const ph=btn.parentElement.querySelector('[data-anim]'); const c=ph.cloneNode(true); ph.replaceWith(c);
  });
});
</script>
