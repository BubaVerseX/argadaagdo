<!doctype html>
<html lang="ka">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ArGadaagdo</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        background: #ece4d6;
        color: #2e2a22;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: env(safe-area-inset-top, 0px) 24px env(safe-area-inset-bottom, 0px);
        box-sizing: border-box;
        text-align: center;
      }
      main { max-width: 22rem; }
      h1 { font-size: 1.4rem; margin: 0 0 0.5rem; }
      p { margin: 0.25rem 0; line-height: 1.5; color: #6b6152; }
      a {
        display: inline-block;
        margin-top: 1.5rem;
        padding: 0.85rem 1.75rem;
        border-radius: 999px;
        background: #a67c52;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <!--
      Shown by Capacitor (server.errorPath in capacitor.config.ts) when the
      live site can't be loaded, e.g. no internet at launch. Keep the link in
      sync with server.url.
    -->
    <main>
      <h1>ArGadaagdo ვერ ჩაიტვირთა</h1>
      <p>შეამოწმე ინტერნეტ კავშირი და სცადე თავიდან.</p>
